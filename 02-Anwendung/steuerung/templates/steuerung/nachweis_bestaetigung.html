{% if n.bestaetigt_am %}<span class="status ok">bestätigt von {{ n.bestaetigt_von.get_username }} {{ n.bestaetigt_am|date:"d.m. H:i" }}</span>{% elif n.benutzer_id == user.pk %}<span class="status aus" title="Die eigene Meldung bestätigt ein anderer Mensch">gemeldet, nicht bestätigt</span>{% else %}<span class="status warn">gemeldet, nicht bestätigt</span> <form method="post" action="{% url 'nachweis_bestaetigen' kennung=projekt.kennung pk=n.pk %}" class="inline">{% csrf_token %}<button type="submit" class="knopf zweit klein">Bestätigen</button></form>{% endif %}
