{% comment %}Termin eines offenen Eintrags setzen, verschieben oder entfernen; ändert weder Revision noch Freigabe. Ohne JavaScript bedienbar. ort unterscheidet die Feldkennung.{% endcomment %}
<form method="post" action="{% url 'auftrag_aktion' auftrag_id=a.pk aktion='faellig' %}" class="faelligform">{% csrf_token %}<input type="hidden" name="zurueck" value="{{ zurueck }}"><label for="faellig-{{ ort }}-{{ a.pk }}">Fällig am</label> <input type="date" id="faellig-{{ ort }}-{{ a.pk }}" name="faellig" value="{{ a.faellig|date:'Y-m-d' }}"> <button type="submit" name="wahl" value="setzen" class="knopf zweit klein">Termin speichern</button>{% if a.faellig %} <button type="submit" name="wahl" value="entfernen" class="knopf zweit klein">Termin entfernen</button>{% endif %}</form>
