{% load steuerung_extras %}{% if baum %}<nav class="modulleiste" aria-label="Nach Modul filtern">{% for reihe in modul_reihen %}<div class="modulreihe">{% for f in reihe %}<a class="modulfeld{% if f.im_pfad %} im-pfad{% endif %}" href="{% filterlink modul=f.kennung %}" title="{{ f.titel }}"{% if modul == f.kennung %} aria-current="true"{% endif %}>{{ f.name }} <span class="anzahl">{{ f.zahl }}</span></a>{% endfor %}</div>{% endfor %}</nav>{% endif %}
