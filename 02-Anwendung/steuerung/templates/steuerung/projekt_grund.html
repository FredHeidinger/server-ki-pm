{% extends "steuerung/grund.html" %}
{% block brotkrumen %}<a href="{% url 'projekte' %}">Projekte</a> › {{ projekt.name }}{% endblock %}
{% block inhalt %}
<div class="seitenkopf">
  <h1>{{ projekt.name }} <span class="kuerzel">{{ projekt.kennung }}</span></h1>
  <div class="werkzeuge"><a class="knopf" href="{% url 'wunsch_neu' %}?projekt={{ projekt.kennung }}">+ Wunsch</a></div>
</div>
<nav class="reiter" aria-label="Bereiche des Projekts">
  <a href="{% url 'projekt_detail' kennung=projekt.kennung %}" {% if reiter == "auftraege" %}aria-current="page"{% endif %}>Aufträge</a>
  <a href="{% url 'projekt_pruefung' kennung=projekt.kennung %}" {% if reiter == "pruefung" %}aria-current="page"{% endif %}>Prüfung</a>
  <a href="{% url 'projekt_entscheidungen' kennung=projekt.kennung %}" {% if reiter == "entscheidungen" %}aria-current="page"{% endif %}>Entscheidungen</a>
  <a href="{% url 'projekt_verlauf' kennung=projekt.kennung %}" {% if reiter == "verlauf" %}aria-current="page"{% endif %}>Verlauf</a>
  <a href="{% url 'projekt_einstellungen' kennung=projekt.kennung %}" {% if reiter == "einstellungen" %}aria-current="page"{% endif %}>Einstellungen</a>
</nav>
{% block projektinhalt %}{% endblock %}
{% endblock %}
