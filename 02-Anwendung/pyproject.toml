[project]
name = "kipm"
version = "0.1.0"
description = "Server-KI-PM: zentrale Auftragssteuerung für Softwareprojekte mit KI-Chats"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=43",
    "django>=5.2,<5.3",
]

[project.optional-dependencies]
server = ["gunicorn>=23"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kipm.settings"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["steuerung/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"steuerung/models.py" = ["DJ008"]
"steuerung/views.py" = ["E501"]
"steuerung/dienst.py" = ["E501"]
"steuerung/akte.py" = ["E501"]
"steuerung/abgleich.py" = ["E501"]
"steuerung/views_akte.py" = ["E501"]
"steuerung/github.py" = ["E501"]
"steuerung/ablage.py" = ["E501"]
"kipm/settings.py" = ["E501"]
"tests/*" = ["E501"]
